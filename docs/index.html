<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ATC4文档</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style type="text/css">
	.markdown-section pre[data-lang] {
		overflow: auto !important;
	}
	
	.markdown-section pre[data-lang] code {
		overflow: visible;
	}

	.line-numbers .line-numbers-rows {
		border-right: 1px solid #ccc;
		padding: 5px;
	}
	
	.markdown-section pre > code {
		padding: 5px;
	}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // 初始化语言
    var currentLang = localStorage.getItem('docsify-lang') || 'zh'; // 默认中文

    // 语言切换函数
    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('docsify-lang', lang);
      document.documentElement.lang = lang;
      // 重新加载页面以应用新语言
      window.location.reload();
    }

    // 更新语言选择器
    function updateLanguageSelector() {
      const selector = document.getElementById('language-selector');
      if (selector) {
        selector.value = currentLang;
      }
    }

    window.$docsify = {
      name: '',
      repo: '',
      loadSidebar: currentLang === 'zh' ? 'cn/_sidebar.md' : 'en/_sidebar.en.md',
      subMaxLevel: 3,
      coverpage: currentLang === 'zh' ? 'cn/_coverpage.md' : 'en/_coverpage.en.md',
      homepage: currentLang === 'zh' ? 'cn/README.md' : 'en/README.en.md',
      // 注意：Docsify 本身不直接支持 'loadLanguages' 来加载 YML 语言包
      // 我们这里通过切换 cn 和 en 目录来实现内容的多语言
      // 界面元素的翻译可以通过自定义 HTML 和 JS 来实现，或者寻找支持 i18n 的 Docsify 插件
      markdown: {
            renderer:{
				code: function(code, lang) {
				    if(lang =='html'){
					  code = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
					}
					return ('<pre data-lang="'+lang+'"><code class="line-numbers language-'+lang+'">'+code+'</code></pre>')
				}
			}	  
	 },
	 plugins: [
		  function (hook, vm) {
        hook.init(function() {
          // 在初始化时设置语言
          document.documentElement.lang = currentLang;
          updateLanguageSelector();
        });

			  hook.doneEach(function (html) {                
        // 每次路由完成后更新语言选择器和 Prism
				Prism.highlightAll();
        updateLanguageSelector();
			  })
		  }
	  ]
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-ini.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/line-numbers/prism-line-numbers.css">
</body>
</html>
